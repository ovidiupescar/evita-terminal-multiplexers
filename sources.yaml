  - id: cluster-availability
    claim: >-
      The instructor guide and the HPC note say that a multiplexer is
      normally available on an HPC login node, with screen the more common of
      the two. No EuroHPC account was available while this module was
      written, so that statement rests on the authors' experience of other
      systems and is labelled as a working assumption in
      content/authoring-evidence.md. Nothing in the module depends on it: the
      whole module runs on the learner's own disposable machine.
    evidence_level: working-assumption
    url: "module.yaml#environments.hpc-cluster"
    source_type: own-observation
    version_scope: "not verified on any cluster during authoring"
    used_in: [content/episodes/use17-2-sessions.md, content/instructor-guide.md, content/authoring-evidence.md]
    verified:
