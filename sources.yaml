  - id: own-transcript
    claim: >-
      Every screen, command and output reproduced in this module comes from
      evidence/transcript.txt, harvested on the pinned baseline as an
      ordinary user with the script evidence/harvest.sh. The 52 screens were
      produced by running the learner's tmux session inside a second tmux
      server whose pane is fixed at 80 columns by 24 rows, and capturing that
      pane; the two servers use different socket names so that the sessions
      listed inside a captured screen are only the ones the episode created.
    evidence_level: verified
    url: "evidence/transcript.txt"
    source_type: own-observation
    version_scope: "Ubuntu 24.04.1 LTS, tmux 3.4, GNU Screen 4.9.1, GNU nano 7.2, Vim 9.1, harvested 2026-07-31"
