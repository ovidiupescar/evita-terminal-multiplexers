# technical-training-authoring skill (assessments designed before content;
# every shown output executed on the pinned baseline and harvested into
# evidence/).
module:
  cqf_id: SDS.OSV1-USE1.7
  skill_id: {scheme: HPC-CF, value: "USE1.7"}
  title: Terminal multiplexers
  hours: 2
  status: review
  license: {content: CC-BY-SA-4.0, code: MIT}

environments:
  - id: local-windows
    audience_path: windows
    specification: "Windows 11 + WSL2 Ubuntu 24.04.1 LTS, tmux 3.4, GNU Screen 4.9.1, GNU nano 7.2, Vim 9.1, ordinary user account"
    evidence: verified
    note: >-
      All transcripts in evidence/ were harvested here. The screens the
      episodes show were produced by running the learner's tmux session
      inside a second tmux server held at 80 columns by 24 rows and
      capturing that pane, so each screen is the real terminal content
      rather than a redrawing. The two servers use different socket names,
      so the sessions listed inside the learner's session are only their
      own.
  - id: local-linux
    audience_path: linux
    specification: "Ubuntu 24.04.4 LTS in a disposable VM (QEMU/KVM, Multipass, libvirt, VirtualBox) or on bare metal, kernel 6.8.0-136-generic, systemd as PID 1, tmux 3.4-1ubuntu0.1, GNU Screen 4.9.1-1ubuntu1, GNU nano 7.2-2ubuntu0.2, Vim 9.1, ordinary user account"
    evidence: verified
    note: >-
      Verified by a second, independent dry run on 2026-08-03, after a
      reviewer pointed out that only the WSL2 path carried executed evidence.
      evidence/dry-run-linux.sh re-executes the spine of every episode on a
      real Linux virtual machine (QEMU/KVM guest booted from the official
      Ubuntu 24.04 cloud image; uname -r reports 6.8.0-136-generic with no
      vendor suffix, ps -p 1 reports systemd and systemd-detect-virt reports
      kvm), and the result is evidence/transcript-linux-dryrun.txt. It covers
      the session lifecycle of Episode 2, the splits and pane query of
      Episode 3, the detach-mid-edit and reattach of Episode 4, the GNU
      screen fallback, and the verified cleanup. The package versions found
      there are the ones this specification pins. Nothing behaved differently
      from the WSL2 path, and no episode text had to change as a result.
  - id: local-macos
    audience_path: macos
    specification: "macOS + Multipass or UTM running Ubuntu 24.04 LTS, ordinary user account"
    evidence: supported
    note: >-
      tmux runs inside the Ubuntu guest, so the key names in this module are
      the guest's. On an Apple keyboard the Control key is the one this
      module calls Ctrl; the Command key is not used. A macOS terminal that
      sends Option as Meta is not required, because this module uses no
      Alt-based binding.
  - id: hpc-cluster
    audience_path: slurm
    specification: "Generic EuroHPC cluster login node: tmux or screen over SSH in the user's own home directory, ordinary user account"
    evidence: supported
    note: >-
      No cluster access during authoring. A login-node session that outlives
      a dropped SSH connection is the situation this module trains for, and
      every command in it runs in the user's own directories without
      privileges. Two things differ on a cluster: which multiplexer is
      installed (screen is present on most systems the authors have used,
      tmux is usual but not guaranteed), and that the disconnect is a real
      event rather than a staged one. Site policy also matters: some centres
      kill leftover login-node processes, so a session is not a place to run
      compute. Declared as a justified limitation.

