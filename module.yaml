cqf_deltas: []

outcomes:
  - id: O1
    official: "Give examples for use cases for such a multiplexer"
    official_source_text: "Give examples for use cases for such a multiplexer"
    observable_form: >-
      Given a described situation on a remote machine, the learner states
      whether a terminal multiplexer answers it and names the mechanism that
      does so: a session owned by a server process on the remote host, which
      keeps running when the client that displays it goes away, so a long
      command survives a dropped connection; several windows and panes in
      one connection, so logs, a job and an editor are visible at once; and
      a session that a second client can attach to, so two people see the
      same screen. The learner also names what a multiplexer does not do,
      including surviving a reboot of the host and protecting an editor
      buffer that was never written.
    bloom: understand
    components: [session-persistence, disconnect-behaviour, multiple-views, use-case-selection]
    activities: [ep2-frame, ep2-evidence, ep2-worked, ep2-guided, ep2-independent, ep3-worked, ep3-guided, ep3-independent]
    assessments: [q1, q2, q3, rc1, rc2, ex1, ex2, hx1]
    evidence_level: verified
  - id: O2
    official: "Review editing files using a terminal multiplexer"
    official_source_text: "Review editing files using a terminal multiplexer"
    observable_form: >-
      The learner opens a file in an editor inside a tmux session, detaches
      while the editor is still running and the buffer is unwritten,
      reattaches from a new client, finishes the edit, writes the file, and
      proves from outside the session that the new content is on disk. The
      learner explains where the prefix key goes when an editor is running
      in the pane and which keystroke reaches the editor instead, and states
      what remains on disk when a session is killed with an unwritten
      buffer.
    bloom: apply
    components: [editor-in-session, detach-reattach-edit, prefix-key-routing, save-and-verify, unsaved-buffer-on-kill]
    activities: [ep4-worked, ep4-guided, ep4-independent]
    assessments: [q4, q5, rc3, ex3, hx1]
    evidence_level: verified

