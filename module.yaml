lab_safety:
  cleanup: verified
  rationale: >-
    Every file this module creates is written under one working directory
    (~/use17) that the learner makes in the setup episode and removes in the
    cleanup section of the last episode; the removal is verified with a
    listing that must report no such directory. Every tmux and screen
    session the module starts is named, and the cleanup section kills the
    tmux server and verifies that "tmux ls" reports no server and
    "screen -ls" reports no sockets, so no process is left running after the
    module. The setup episode installs two packages (tmux and screen) with
    apt; the cleanup section states that both are left in place on purpose,
    because a disposable VM is discarded whole. The staged failures are a
    session ended by exit, a detached client, and a killed server, none of
    which changes state outside the working directory. No service, no
    boot-time state and no root-owned file is created.

